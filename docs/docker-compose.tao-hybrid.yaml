name: tao_hybrid

services:
  mysql:
    container_name: tao-hybrid-mysql
    image: mysql:8
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${TAO_HYBRID_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: TaoHybridRAG
    volumes:
      - tao-hybrid-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --explicit_defaults_for_timestamp=true --lower_case_table_names=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    container_name: tao-hybrid-redis
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --bind 0.0.0.0 --port 6379 --requirepass ${TAO_HYBRID_REDIS_PASSWORD} --appendonly yes
    volumes:
      - tao-hybrid-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${TAO_HYBRID_REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    container_name: tao-hybrid-kafka
    image: bitnamilegacy/kafka:latest
    restart: unless-stopped
    ports:
      - "19092:9094"
      - "19093:9093"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_CFG_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://tao-hybrid-kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # The backend publishes file-processing tasks with Kafka transactions.
      # A local single-broker setup cannot use Kafka's default replication factor of 3.
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - tao-hybrid-kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    container_name: tao-hybrid-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${TAO_HYBRID_MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - tao-hybrid-minio-data:/data

  es:
    container_name: tao-hybrid-es
    image: elasticsearch:8.10.4
    restart: unless-stopped
    ports:
      - "9201:9200"
    environment:
      ELASTIC_PASSWORD: ${TAO_HYBRID_ELASTIC_PASSWORD}
      node.name: tao-hybrid-es01
      cluster.name: tao-hybrid-rag-cluster
      discovery.type: single-node
      xpack.license.self_generated.type: basic
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - tao-hybrid-es-data:/usr/share/elasticsearch/data
    command:
      - /bin/bash
      - -c
      - |
        if ! elasticsearch-plugin list | grep -q 'analysis-ik'; then
          elasticsearch-plugin install --batch https://release.infinilabs.com/analysis-ik/stable/elasticsearch-analysis-ik-8.10.4.zip;
        fi;
        /usr/local/bin/docker-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  tao-hybrid-mysql-data:
  tao-hybrid-redis-data:
  tao-hybrid-kafka-data:
  tao-hybrid-minio-data:
  tao-hybrid-es-data:
